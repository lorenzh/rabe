name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.0'
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run validate
      - run: bun run test
      - name: Docs change with code
        if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'no-docs')
        run: |
          changed=$(git diff --name-only "origin/$GITHUB_BASE_REF...HEAD")
          code=$(printf '%s\n' "$changed" | grep -E '^(hooks/|commands/|types/index\.d\.ts$|data/|\.claude-plugin/)' | grep -v -E '\.test\.tsx?$' || true)
          docs=$(printf '%s\n' "$changed" | grep -E '^(docs/|README\.md$|CHANGELOG\.md$|RELEASING\.md$|AGENTS\.md$|CONTRIBUTING\.md$)' || true)
          if [ -n "$code" ] && [ -z "$docs" ]; then
            echo "::error::A pull request that changes code must also change docs/, README.md, CHANGELOG.md, RELEASING.md, AGENTS.md, or CONTRIBUTING.md. Update the docs, or add the no-docs label with a reason in the PR body."
            exit 1
          fi
